<p>home works!</p>
<a routerLink="/workspace/ppt">to ppt</a>

<div class="presentations">
    <h5>Presentations</h5>
    <div class="d-flex gap-3 p-2 ppt-prev-list">
        @for (item of presentations; track $index) {
        
        <div routerLink="/workspace/ppt" [queryParams]="{ id: item.id }" class="ppt-prev p-2">
            <p>
                {{item.name ?? 'Untitled'}}
            </p>
            <p>
                Slides : {{item.slideCount}}
            </p>
        </div>
        }
    </div>
</div>
