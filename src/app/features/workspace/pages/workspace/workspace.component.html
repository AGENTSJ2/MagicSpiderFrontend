<div class="workspace d-flex flex-column">
  <div class="nav d-flex justify-content-between align-items-center px-2">
    <div class="d-flex gap-3">
      <div class="home-btn">
        <i class="fi fi-rs-home"></i>
      </div>
      <p class="mb-0">File Name</p>
    </div>
    <div>
      <div class="share-btn">
        <i class="fi fi-rr-upload"></i>
        Share
      </div>
    </div>
  </div>
  <div class="d-flex flex-1">
    <div class="side-bar px-3 py-4 d-flex flex-column gap-3">
      <div class="menu-item d-flex gap-1 flex-column " (click)="handleAddText()">
        <i class="fi fi-rr-text d-flex justify-content-center align-items-center fs-4"></i>
        <p class="mb-0 text-center" >Text</p>
      </div>
      <div class="menu-item d-flex gap-1 flex-column">
        <i class="fi fi-rr-resources d-flex justify-content-center align-items-center fs-4"></i>
        <p class="mb-0 text-center">Shape</p>
      </div>
      <div class="menu-item d-flex gap-1 flex-column">
        <i class="fi fi-rr-file-upload d-flex justify-content-center align-items-center fs-4"></i>
        <p class="mb-0 text-center">Upload</p>
      </div>
    </div>
    <div class="content-wrapper flex-1 d-flex flex-column">
      <div class="slide-view d-flex flex-column flex-1 py-3 flex-1 justify-content-center align-items-center">
        <div class="parent-slide-wrapper">
          <app-slide ></app-slide>
        </div>
      </div>
      <div class="ppt-list d-flex justify-content-center align-items-center gap-3">
        <div class="slide-preview-wrapper">
          slide 1
        </div>
        <button class="add-slide">
          <i class="fi fi-ss-add"></i>
        </button>
      </div>
    </div>
  </div>
</div>
