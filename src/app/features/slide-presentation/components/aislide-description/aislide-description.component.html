<nz-modal [(nzVisible)]="workspaceController.showSlideDescription" [nzTitle]="modalTitle" [nzFooter]="null"
  [nzMaskClosable]="phase === StreamPhase.idle"
  [nzClosable]="phase === StreamPhase.idle || phase === StreamPhase.done || phase === StreamPhase.error"
  (nzOnCancel)="handleCancel()" nzClassName="content-creator-modal" [nzStyle]="{top:'0px'}" nzWidth="70vw">
  <!-- Title Template -->
  <ng-template #modalTitle>
    <div class="modal-title gap-2">
      <div>
        <span nz-icon nzType="highlight" nzTheme="twotone" style="margin-right:8px;font-size:18px;"></span>
        Scratch Book
      </div>
      <div>
        <button nz-button nzType="default" (click)="handleInvokeMagicSpider()"
          *ngIf="phase !=StreamPhase.thinking && phase !=StreamPhase.content">
          Start Magic Spider
        </button>
      </div>
    </div>
  </ng-template>

  <!-- Body -->
  <ng-container *nzModalContent>
    <div class="modal-body">
      <!-- ── Thinking ───────────────────────────────────────── -->
      <div class="thinking-section" *ngIf="phase === StreamPhase.thinking">
        <div class="thinking-header">
          <nz-spin nzSimple [nzSize]="'small'" *ngIf="phase === StreamPhase.thinking"></nz-spin>
          <span nz-icon nzType="bulb" nzTheme="twotone" *ngIf="phase !== StreamPhase.thinking"
            style="color:#faad14"></span>
          <span class="thinking-label">Thinking process</span>
        </div>
        <div class="thinking-box" #thinkingBox>
          <pre
            class="thinking-text">{{ thinkingText }}<span class="cursor" *ngIf="phase === StreamPhase.thinking">▌</span></pre>
        </div>
      </div>

      <!-- ── Content (Markdown) ─────────────────────────────── -->
      <!-- <ngx-quill #editor [modules]="modules" (contentChanged)="logChange($event);"></ngx-quill> -->
      <div class="content-section">
        <div class="markdown-output" #genContent>
          <quill-editor [(ngModel)]="contentText" format="html" [modules]="this.editorModules"
            class="w-100 h-100"></quill-editor>
          <span class="cursor" *ngIf="phase === StreamPhase.content">▌</span>
        </div>
      </div>
      <!-- ── Input ───────────────────────────────────────────── -->
      <div class="input-section">
        <div class="input-label d-flex gap-2">
          <div>
            Describe your topic or request changes
          </div>
          <span class="char-count">{{ problemStatement?.length ?? 0 }} characters</span>

        </div>
        <div class="d-flex w-100 justify-content-center align-items-center gap-2 problem-wrapper">
          <div class="flex-fill input-wrapper">
            @if(problemStatement?.length == 0)
            {
              <span class="problem-placeholder " (click)="prblm.focus()" >
                Whats the topic on your mind..
              </span>
            }
            <span contentEditableModel contenteditable [(ngModel)]="problemStatement" class="problem-input w-100 d-flex" #prblm></span>
            
          </div>
          <button class="send-btn" (click)="generate()">
            @if(phase == StreamPhase.thinking || phase == StreamPhase.content)
            {
              <span class="spinner-border req-spinner" role="status"></span>
            }
            @else
            {
              <i class="fi fi-sr-paper-plane-top d-flex justify-content-between align-items-center"></i>
            }
          </button>
        </div>
      </div>
      <!-- ── Error ──────────────────────────────────────────────────── -->
      <nz-alert *ngIf="phase === StreamPhase.error" nzType="error" [nzMessage]="errorMessage" nzShowIcon></nz-alert>

    </div>
  </ng-container>
