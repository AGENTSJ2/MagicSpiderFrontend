<nz-modal [(nzVisible)]="workspaceController.showSlideDescription" [nzTitle]="modalTitle" [nzFooter]="null"
  
  (nzOnCancel)="handleCancel()" nzClassName="content-creator-modal" [nzStyle]="{top:'20px'}" nzWidth="70vw">
  <!-- Title Template -->
  <ng-template #modalTitle>
    <div class="modal-title justify-content-between">
      <div>
        <span nz-icon nzType="highlight" nzTheme="twotone" style="margin-right:8px;font-size:18px;"></span>
        Scratch Book
      </div>
      <div class="me-4">
        <button nz-button nzType="default" (click)="handleInvokeMagicSpider()">
          Create Slides
        </button>
      </div>
    </div>
  </ng-template>

  <!-- Body -->
  <ng-container *nzModalContent>
    <div class="modal-body">
      <!-- ── Thinking ───────────────────────────────────────── -->
      <div class="thinking-section" *ngIf="this.contentCreatorAgent.contentCreatorState == this.AgentState.thinking || this.contentCreatorAgent.contentCreatorState == this.AgentState.invoked">
        <div class="thinking-header">
          <span class="thinking-label">Thinking...</span>
        </div>
        <div class="thinking-box" #thinkingBox>
          <pre
            class="thinking-text">{{ thinkingText }}<span class="cursor" *ngIf="this.contentCreatorAgent.contentCreatorState == this.AgentState.thinking">▌</span></pre>
        </div>
      </div>
      <!-- ── Content (Markdown) ─────────────────────────────── -->
      <div class="content-section">
        <div class="markdown-output" #genContent>
          <quill-editor [(ngModel)]="workspaceController.scratchBookContent" format="html" [modules]="this.editorModules" [readOnly]="isAgentInaction()"
            class="w-100 h-100" (ngModelChange)="handleContentChange()"></quill-editor>
          <span class="cursor" *ngIf="isAgentInaction()">▌</span>
        </div>
      </div>
      <!-- ── Input ───────────────────────────────────────────── -->
      <div class="input-section">
        <div class="input-label d-flex gap-2 align-items-center">
          <div>
            Describe your topic or request changes
          </div>
          <span class="char-count">{{ problemStatement?.length ?? 0 }} characters</span>
          <div class="model-chip user-select-none ms-auto" (click)="workspaceController.handleOpenSettings('ai')">
            {{ contentModel?.displayName ?? 'Select model' }}
          </div>
        </div>
        <div class="d-flex w-100 justify-content-center align-items-center gap-2 problem-wrapper">
          <div class="flex-fill input-wrapper">
            @if(problemStatement?.length == 0)
            {
              <span class="problem-placeholder" (click)="prblm.focus()" >
                Whats the topic on your mind..
              </span>
            }
            <span contentEditableModel contenteditable [(ngModel)]="problemStatement" class="problem-input w-100 d-flex" #prblm></span>
            
          </div>
          <button class="send-btn" (click)="trigger()">
            @if(isAgentInaction())
            {
              <i class="fi fi-sr-stop d-flex justify-content-between align-items-center"></i>
            }
            @else
            {
              <i class="fi fi-sr-paper-plane-top d-flex justify-content-between align-items-center"></i>
            }
          </button>
        </div>
      </div>
      <nz-alert *ngIf="errorMessage" nzType="error" [nzMessage]="errorMessage" nzShowIcon></nz-alert>
    </div>
  </ng-container>
