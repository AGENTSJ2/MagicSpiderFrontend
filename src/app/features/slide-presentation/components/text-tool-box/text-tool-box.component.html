<div class="toolbox-panel" *ngIf="form">
    <form action="" [formGroup]="form">

        <div class="toolbox-title">Text properties</div>

        <!-- Content -->
        <div class="mb-3">
            <label class="form-label">Content</label>
            <textarea class="form-control" rows="3" formControlName="text"></textarea>
        </div>

        <!-- Font family + Style -->
        <div class="row-half mb-3">
            <div>
                <label class="form-label">Font family</label>
                <select class="form-select" formControlName="fontFamily">
                    <option>Arial</option>
                    <option>Calibri</option>
                    <option>Times New Roman</option>
                    <option>Verdana</option>
                </select>
            </div>

            <div>
                <label class="form-label">Style</label>
                <select class="form-select" formControlName="fontStyle">
                    <option value="normal">Normal</option>
                    <option value="bold">Bold</option>
                    <option value="italic">Italic</option>
                </select>
            </div>
        </div>

        <!-- Font size + Line height -->
        <div class="row-half mb-3">
            <div>
                <label class="form-label">Font size</label>
                <input type="number" class="form-control" formControlName="fontSize" />
            </div>

            <div>
                <label class="form-label">Line height</label>
                <input type="number" step="0.1" class="form-control" formControlName="lineHeight" />
            </div>
        </div>
        <!-- Stroke width and color  -->
        <div class="row-half mb-3">
            <div>
                <label class="form-label">Stroke color</label>
                <div class="color-row">
                    <div class="color-preview" [style.background]="form.value.stroke">
                        <input type="color" formControlName="stroke" />
                    </div>
                    <span class="color-hex">{{ form.value.stroke }}</span>
                </div>
            </div>
            <div>
                <label class="form-label">Stroke width</label>
                <input class="form-control" type="number" min="0" formControlName="strokeWidth" />
            </div>
        </div>
        <hr class="section-divider" />

        <!-- Color -->
        <div class="mb-3 row-half">
            <div>
                <label class="form-label">Text color</label>
                <div class="color-row">
                    <div class="color-preview" [style.background]="form.value.fill">
                        <input type="color" formControlName="fill" />
                    </div>
                    <span class="color-hex">{{ form.value.fill }}</span>
                </div>
            </div>
            <div>
                <label class="form-label">Alignment</label>
                <select class="form-select" formControlName="align">
                    <option value="left">Left</option>
                    <option value="center">Center</option>
                    <option value="right">Right</option>
                </select>
            </div>
        </div>


        <div class="mb-3">
            <label>
                Gradient Color
            </label>
            <input class="ms-3 form-check-input" type="checkbox" formControlName="gradientEnabled" />
        </div>

        <div *ngIf="form.value.gradientEnabled" class="row-half mb-3">
            <div class="color-row align-items-center">
                <div class="color-preview" [style.background]="form.value.gradientStart">
                    <input type="color" formControlName="gradientStart" />
                </div>
                <span class="color-hex">{{ form.value.gradientStart }}</span>
            </div>
            <div class="color-row align-items-center">
                <div class="color-preview" [style.background]="form.value.gradientEnd">
                    <input type="color" formControlName="gradientEnd" />
                </div>
                <span class="color-hex">{{ form.value.gradientEnd }}</span>
            </div>
        </div>
        <div *ngIf="form.value.gradientEnabled" class="mb-3">
            <label class="form-label">Gradient Position</label>

            <input type="range" min="0" max="1" step="0.01" formControlName="gradientOffset" class="form-range" />

            <div class="d-flex justify-content-between">
                <span>0</span>
                <span>{{ form.value.gradientOffset }}</span>
                <span>1</span>
            </div>
        </div>
    </form>

</div>
